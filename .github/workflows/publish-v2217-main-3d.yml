name: Publish Muhammad Robot v2.2.17 - 3D primary cream orb and Studio
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v2217-main-3d.yml'
      - 'scripts/build_v2217_main_3d.py'
      - 'scripts/test_v2217_main_3d.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Never overwrite a released version
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v2.2.17 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'found=true' >> "$GITHUB_OUTPUT"
          else
            echo 'found=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Download immutable v2.2.16 and Windows-tested 3D v0.3.0
        if: steps.exists.outputs.found == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p baseline dist
          gh release download v2.2.16 --repo "$GITHUB_REPOSITORY" --pattern 'MuhammadRobot-2.2.16.zip' --dir baseline
          gh release download 3d-preview-v0.3.0 --repo "$GITHUB_REPOSITORY" --pattern 'MuhammadRobot3D-preview-v0.3.0-Windows.zip' --dir baseline
      - name: Assemble single main 3D robot + voice cream eye orb + editor remains 3D
        if: steps.exists.outputs.found == 'false'
        run: |
          python3 scripts/build_v2217_main_3d.py \
            baseline/MuhammadRobot-2.2.16.zip \
            baseline/MuhammadRobot3D-preview-v0.3.0-Windows.zip \
            dist/MuhammadRobot-2.2.17.zip
      - name: Verify deployed updater safety, Classic fallback, Studio and Close voice commands
        if: steps.exists.outputs.found == 'false'
        run: |
          python3 scripts/test_v2217_main_3d.py baseline/MuhammadRobot-2.2.16.zip dist/MuhammadRobot-2.2.17.zip
      - name: Publish after passing checks
        if: steps.exists.outputs.found == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v2.2.17 dist/MuhammadRobot-2.2.17.zip dist/manifest.json \
            --repo "$GITHUB_REPOSITORY" \
            --title 'Muhammad Robot v2.2.17 - Real 3D Primary Cream Orb' \
            --notes 'Godot 3D plush is now the primary desktop view; Classic remains a right-click fallback. Offline Close robot/Open robot voice commands are forwarded from the original Python host to the Godot 3D window. Close shows a 54px creamy round orb with exactly two black eyes, bottom left; click-to-reopen vs hold-drag-to-relocate. Cream-colored body under softer lighting rather than pure white. Python Studio opens as a separate editor window WITHOUT closing or swapping out the live 3D mascot. Auto-updater remains compatible and can restart the host even while 3D is active. All stored scripts, microphone, update settings remain unchanged.' \
            --latest
