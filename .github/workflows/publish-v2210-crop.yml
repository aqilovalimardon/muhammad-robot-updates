name: Publish Muhammad Robot v2.2.10 critical crop fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v2210-crop.yml'
      - 'scripts/build_v2210_crop.py'
      - 'scripts/test_v2210_crop.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check existing v2.2.10 release
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v2.2.10 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'found=true' >> "$GITHUB_OUTPUT"
          else
            echo 'found=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Download verified v2.2.9 baseline
        if: steps.exists.outputs.found == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p baseline dist
          gh release download v2.2.9 --repo "$GITHUB_REPOSITORY" --pattern 'MuhammadRobot-2.2.9.zip' --dir baseline
      - name: Build isolated crop fix, checksum pin all other files
        if: steps.exists.outputs.found == 'false'
        run: |
          python3 scripts/build_v2210_crop.py baseline/MuhammadRobot-2.2.9.zip dist/MuhammadRobot-2.2.10.zip
      - name: Setup isolated Tk GUI display
        if: steps.exists.outputs.found == 'false'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-tk xvfb
      - name: Prove sprite stays inside real Tk Canvas for 180 frames
        if: steps.exists.outputs.found == 'false'
        run: |
          xvfb-run -a python3 scripts/test_v2210_crop.py dist/MuhammadRobot-2.2.10.zip
          xvfb-run -a python3 scripts/test_badge_v225.py dist/MuhammadRobot-2.2.10.zip
      - name: Publish only when all tests pass
        if: steps.exists.outputs.found == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v2.2.10 dist/MuhammadRobot-2.2.10.zip dist/manifest.json \
            --repo "$GITHUB_REPOSITORY" \
            --title 'Muhammad Robot v2.2.10 - Fix Half-Size Cropping' \
            --notes 'Critical correction: the 100x112 mascot sprite was being moved to the old (95,98) center every animation tick. Now consistently centered at (width//2,height//2), retaining the mini cream mascot, belly button, eyes, 36 frames, English voice, Python Studio, animated bubble menu, minimized-eye orb and automatic updates. No user files changed.' \
            --latest
