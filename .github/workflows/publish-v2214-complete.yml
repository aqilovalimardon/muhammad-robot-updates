name: Publish Muhammad Robot v2.2.14 stable cream and antenna
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v2214-complete.yml'
      - 'scripts/build_v2214_complete.py'
      - 'scripts/test_v2214_complete.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify no existing release
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v2.2.14 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Download baseline and deployed safety validator
        if: steps.rel.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p old dist
          gh release download v2.2.13 --repo "$GITHUB_REPOSITORY" --pattern 'MuhammadRobot-2.2.13.zip' --dir old
          gh release download v2.2.10 --repo "$GITHUB_REPOSITORY" --pattern 'MuhammadRobot-2.2.10.zip' --dir old
      - name: Install build and test dependencies
        if: steps.rel.outputs.exists == 'false'
        run: |
          python3 -m pip install --user Pillow
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-tk xvfb
      - name: Re-render 72 frames from intact original reference
        if: steps.rel.outputs.exists == 'false'
        run: |
          python3 scripts/build_v2214_complete.py old/MuhammadRobot-2.2.13.zip dist/MuhammadRobot-2.2.14.zip
      - name: Verify original full body, antenna, eyes and current updater
        if: steps.rel.outputs.exists == 'false'
        run: |
          xvfb-run -a python3 scripts/test_v2214_complete.py old/MuhammadRobot-2.2.10.zip dist/MuhammadRobot-2.2.14.zip
          xvfb-run -a python3 scripts/test_badge_v225.py dist/MuhammadRobot-2.2.14.zip
      - name: Publish only after verification
        if: steps.rel.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v2.2.14 dist/MuhammadRobot-2.2.14.zip dist/manifest.json \
            --repo "$GITHUB_REPOSITORY" \
            --title 'Muhammad Robot v2.2.14 - Complete Cream Body and Moving Antenna' \
            --notes 'Rebuilds from original approved complete cream-white 3D front-facing reference, not the damaged v2.2.13 rendered images. Stabilizes full body and original glossy visor; gently swings antenna and shifts pupils within original eyes. Preserves tiny 100x112 size, 84-file archive compatibility, belly Run Python menu, classic appearance fallback, microphone, Studio, saved user data and automatic GitHub updater.' \
            --latest
