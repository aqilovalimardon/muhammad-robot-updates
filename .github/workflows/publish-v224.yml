name: Publish Muhammad Robot v2.2.4 automatic-update test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v224.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check published version
        id: found
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v2.2.4 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Download published v2.2.3 program
        if: steps.found.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p old dist
          gh release download v2.2.3 --repo "$GITHUB_REPOSITORY" --pattern 'MuhammadRobot-2.2.3.zip' --dir old
      - name: Build and validate minimal v2.2.4
        if: steps.found.outputs.exists == 'false'
        run: |
          python scripts/build_v224.py old/MuhammadRobot-2.2.3.zip dist/MuhammadRobot-2.2.4.zip
      - name: Publish release assets
        if: steps.found.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v2.2.4 dist/MuhammadRobot-2.2.4.zip dist/manifest.json \
            --repo "$GITHUB_REPOSITORY" \
            --title 'Muhammad Robot v2.2.4 - Passive Update Test' \
            --notes 'Only version number changes. Verifies unattended GitHub checking, download, SHA-256 validation, installation and safe restart. No changes to voice, visual assets, Python Studio, or personal code.' \
            --latest
