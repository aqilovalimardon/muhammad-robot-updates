name: Diagnose passive GitHub polling v2.2.10
on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-update-timer.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect actual update schedule and comparison source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/mrobot
          gh release download v2.2.10 --repo "$GITHUB_REPOSITORY" --pattern 'MuhammadRobot-2.2.10.zip' --dir /tmp/mrobot
          python3 - <<'PY'
          import zipfile,re
          p='/tmp/mrobot/MuhammadRobot-2.2.10.zip'
          with zipfile.ZipFile(p) as z:
              for name in ('app/robot_app.py','app/robot_core.py'):
                  s=z.read(name).decode('utf-8').splitlines()
                  matches=[i for i,line in enumerate(s) if any(t in line for t in ('background_update_check','_poll_updates','check_updates_now','after(720','720000','720_000','version_tuple','version_key','parse_version','releases/latest','APP_VERSION','version_cmp','def check_git','getaddrinfo'))]
                  printed=set()
                  print('=== FILE',name,'===')
                  for k in matches:
                      for j in range(max(0,k-5),min(len(s),k+10)):
                          if j not in printed:
                              print(f'{j+1:04d}: {s[j]}')
                              printed.add(j)
          PY
