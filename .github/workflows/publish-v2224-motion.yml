name: Validate and publish v2.2.24 voice gestures and desktop flight
on:
  push:
    branches: [main, feature/voice-flight-jump]
    paths:
      - 'robot3d/**'
      - 'runtime/robot_app.py'
      - 'runtime/voice_commands.py'
      - 'scripts/build_v2224_motion.py'
      - 'scripts/build_v2223_plush.py'
      - 'scripts/test_v2223_plush.py'
      - 'scripts/test_v2222_popup.py'
      - 'scripts/test_v2221_voice.py'
      - 'scripts/test_v2221_windows_voice.py'
      - 'scripts/make_voice_fixtures.ps1'
      - '.github/workflows/publish-v2224-motion.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: motion-v2224-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot and virtual display
        run: |
          set -euo pipefail
          curl -fL --retry 3 --connect-timeout 25 -o /tmp/godot.zip 'https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip'
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri python3-tk
      - name: Import, exercise real scene, export resource pack
        run: |
          set -euo pipefail
          GODOT=/tmp/Godot_v4.7.2-stable_linux.x86_64
          "$GODOT" --headless --path robot3d --editor --quit 2>&1 | tee /tmp/import.log
          "$GODOT" --headless --path robot3d -- --interaction-test 2>&1 | tee /tmp/interaction.log
          grep -q 'PASS: real scene emotions' /tmp/interaction.log
          grep -q 'PASS: local fur stretch' /tmp/interaction.log
          mkdir -p dist review
          "$GODOT" --headless --path robot3d --export-pack 'Windows Desktop' "$GITHUB_WORKSPACE/dist/MuhammadRobot3D.pck" 2>&1 | tee /tmp/export.log
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:' /tmp/import.log /tmp/interaction.log /tmp/export.log; then exit 1; fi
      - name: Capture actual rendered expressions and generated sound samples
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          ROBOT_REVIEW_DIR: ${{ github.workspace }}/review
        run: |
          set -euo pipefail
          xvfb-run -a /tmp/Godot_v4.7.2-stable_linux.x86_64 --audio-driver Dummy --path robot3d -- --capture-review 2>&1 | tee /tmp/render.log
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:' /tmp/render.log; then exit 1; fi
          test -s review/dizzy.png
          test -s review/laugh.png
          test -s review/angry.png
          test -s review/laugh.wav
          test -s review/open.wav
          test -s review/sad.png
          test -s review/fur_tug.png
          test -s review/sad.wav
          xvfb-run -a /tmp/Godot_v4.7.2-stable_linux.x86_64 --audio-driver Dummy --path robot3d -- --motion-test 2>&1 | tee /tmp/motion.log
          grep -q 'PASS: Hello hand wave' /tmp/motion.log
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:' /tmp/motion.log; then exit 1; fi
          test -s review/hello.png
          test -s review/flight.png
          test -s review/jump.png
      - name: Build exact versioned ZIP and verify existing host behavior
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p baseline
          gh release download v2.2.23 --repo "$GITHUB_REPOSITORY" --pattern 'MuhammadRobot-2.2.23.zip' --dir baseline
          python3 scripts/build_v2224_motion.py baseline/MuhammadRobot-2.2.23.zip dist/MuhammadRobot3D.pck dist/MuhammadRobot-2.2.24.zip
          xvfb-run -a /usr/bin/python3 scripts/test_v2223_plush.py baseline/MuhammadRobot-2.2.23.zip dist/MuhammadRobot-2.2.24.zip --motion --ui --godot /tmp/Godot_v4.7.2-stable_linux.x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: robot-v2224-package
          path: |
            dist/MuhammadRobot-2.2.24.zip
            dist/manifest.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: robot-v2224-review
          path: |
            review/
            /tmp/import.log
            /tmp/interaction.log
            /tmp/export.log
            /tmp/render.log
            /tmp/motion.log

  windows-test:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: robot-v2224-package
          path: package
      - name: Run exported Windows EXE with actual packaged interaction tests
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Expand-Archive -LiteralPath 'package/MuhammadRobot-2.2.24.zip' -DestinationPath 'installed'
          $exe=(Resolve-Path 'installed/app/visual3d/MuhammadRobot3D.exe').Path
          $log=Join-Path $PWD 'windows-interaction.log'
          $p=Start-Process -FilePath $exe -ArgumentList '--headless','--log-file',"`"$log`"",'--','--interaction-test' -PassThru -NoNewWindow
          if (-not $p.WaitForExit(90000)) { $p.Kill(); throw 'Windows interaction test timed out' }
          if ($p.ExitCode -ne 0) { throw "Windows test failed: $($p.ExitCode)" }
          $text=Get-Content -Raw $log
          Write-Output $text
          if ($text -notmatch 'PASS: real scene emotions' -or $text -notmatch 'PASS: Hello hand wave' -or $text -notmatch 'PASS: local fur stretch' -or $text -match 'SCRIPT ERROR|Parse Error|ERROR:') { throw 'Windows interaction assertions did not pass' }
      - name: Render the native Windows avatar and click-through trail
        shell: pwsh
        env:
          ROBOT_REVIEW_DIR: ${{ github.workspace }}/windows-review
        run: |
          $ErrorActionPreference = 'Stop'
          $visual = (Resolve-Path 'installed/app/visual3d').Path
          $mesa = Join-Path $env:RUNNER_TEMP 'mesa-flight.7z'
          $unpacked = Join-Path $env:RUNNER_TEMP 'mesa-flight'
          curl.exe -fsSL --retry 3 'https://github.com/pal1000/mesa-dist-win/releases/download/26.3.0/mesa3d-26.3.0-release-msvc.7z' -o $mesa
          if ($LASTEXITCODE -ne 0 -or (Get-FileHash $mesa).Hash -ne 'c505fcc77e8f63a09d7ddac086591d2f542c0698d37fc9e3094685a34d0d9991') { throw 'Test renderer download failed verification' }
          7z x $mesa "-o$unpacked" x64/vulkan_lvp.dll x64/lvp_icd.x86_64.json -y
          if ($LASTEXITCODE -ne 0) { throw 'Could not extract the test renderer' }
          $loader = Join-Path $env:RUNNER_TEMP 'vulkan-flight.zip'
          curl.exe -fsSL --retry 3 'https://sdk.lunarg.com/sdk/download/1.4.328.1/windows/VulkanRT-X64-1.4.328.1-Components.zip' -o $loader
          if ($LASTEXITCODE -ne 0 -or (Get-FileHash $loader).Hash -ne '293efbb2c11e60429df7770f40e3c5c811a7fa42af81de0cc41e8718ddb2b373') { throw 'Test loader download failed verification' }
          Expand-Archive -LiteralPath $loader -DestinationPath "$unpacked/loader"
          Copy-Item "$unpacked/loader/VulkanRT-X64-1.4.328.1-Components/x64/vulkan-1.dll" -Destination $visual
          $env:VK_DRIVER_FILES = (Resolve-Path "$unpacked/x64/lvp_icd.x86_64.json").Path
          New-Item -ItemType Directory -Force $env:ROBOT_REVIEW_DIR | Out-Null
          $log = Join-Path $PWD 'windows-native-motion.log'
          $args3d = @('--rendering-method','mobile','--rendering-driver','vulkan','--audio-driver','Dummy','--log-file',('"' + $log + '"'),'--','--motion-test')
          $p = Start-Process -FilePath "$visual/MuhammadRobot3D.exe" -WorkingDirectory $visual -ArgumentList $args3d -PassThru
          if (-not $p.WaitForExit(60000)) {
            $p.Kill()
            if (Test-Path $log) { Get-Content $log }
            throw 'Native Windows motion test timed out'
          }
          $result = Get-Content -Raw $log
          Write-Output $result
          if ($p.ExitCode -ne 0 -or $result -notmatch 'PASS: Hello hand wave' -or $result -match 'SCRIPT ERROR|Parse Error|ERROR:') { throw 'Native Windows motion failed' }
          foreach ($frame in 'hello','flight','jump') {
            if (-not (Test-Path "$env:ROBOT_REVIEW_DIR/$frame.png")) { throw "Missing rendered $frame frame" }
          }
      - name: Upgrade user settings, launch the 3D host, open Studio and test the shared menu
        if: ${{ !cancelled() }}
        timeout-minutes: 4
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force baseline | Out-Null
          gh release download v2.2.23 --repo "$env:GITHUB_REPOSITORY" --pattern 'MuhammadRobot-2.2.23.zip' --dir baseline
          if ($LASTEXITCODE -ne 0) { throw 'Baseline download failed' }
          python -m pip install --disable-pip-version-check pillow
          if ($LASTEXITCODE -ne 0) { throw 'Screenshot dependency failed' }
          python scripts/test_v2223_plush.py baseline/MuhammadRobot-2.2.23.zip package/MuhammadRobot-2.2.24.zip --motion --ui
          if ($LASTEXITCODE -ne 0) { throw 'Native context menu check failed' }
      - name: Generate actual offline Windows voice samples
        if: ${{ !cancelled() }}
        shell: powershell
        run: ./scripts/make_voice_fixtures.ps1
      - name: Recognize real audio and drive the shipped 3D robot
        if: ${{ !cancelled() }}
        timeout-minutes: 7
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python -m pip install --disable-pip-version-check vosk==0.3.45
          if ($LASTEXITCODE -ne 0) { throw 'Test recognizer install failed' }
          python scripts/test_v2221_windows_voice.py package/MuhammadRobot-2.2.24.zip voice-fixtures --menu-open --motion
          if ($LASTEXITCODE -ne 0) { throw 'Actual voice integration failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: robot-v2224-windows-log
          path: |
            windows-interaction.log
            windows-native-motion.log
            windows-review/
            windows-voice-integration.log
            voice-fixtures/
            popup-review.png
            outside-click-review.png

  publish:
    if: github.ref == 'refs/heads/main'
    needs: windows-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: robot-v2224-package
          path: package
      - name: Publish immutable update after Linux and Windows checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v2.2.24 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Existing release retained'; exit 0
          fi
          gh release create v2.2.24 package/MuhammadRobot-2.2.24.zip package/manifest.json \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title 'Muhammad Robot v2.2.24 - Wave, fly, stop and jump' \
            --notes 'Say Hello robot for a spoken greeting and a hand wave. Fly robot starts a desktop flight with a fading blue trail. Stop robot stops the robot where it is. Jump robot makes one hop. The existing offline microphone model recognizes all six commands, including Open robot and Close robot. Grabbing the robot pauses flight so fur stretching, petting and moving the robot remain available. The update preserves saved code, voice preferences, sound settings and the previous release for rollback.'
