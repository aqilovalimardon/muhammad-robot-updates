name: Validate and publish v2.2.19 shared menu and soft plush
on:
  push:
    branches: [main, feature/plush-menu]
    paths:
      - 'robot3d/**'
      - 'scripts/build_v2219_plush.py'
      - 'scripts/test_v2219_plush.py'
      - 'scripts/test_v2219_native_menu.py'
      - '.github/workflows/publish-v2219-plush.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: plush-v2219-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot and virtual display
        run: |
          set -euo pipefail
          curl -fL --retry 3 --connect-timeout 25 -o /tmp/godot.zip 'https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip'
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri python3-tk
      - name: Import, exercise real scene, export resource pack
        run: |
          set -euo pipefail
          GODOT=/tmp/Godot_v4.7.2-stable_linux.x86_64
          "$GODOT" --headless --path robot3d --editor --quit 2>&1 | tee /tmp/import.log
          "$GODOT" --headless --path robot3d -- --interaction-test 2>&1 | tee /tmp/interaction.log
          grep -q 'PASS: real scene emotions' /tmp/interaction.log
          mkdir -p dist review
          "$GODOT" --headless --path robot3d --export-pack 'Windows Desktop' "$GITHUB_WORKSPACE/dist/MuhammadRobot3D.pck" 2>&1 | tee /tmp/export.log
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:' /tmp/import.log /tmp/interaction.log /tmp/export.log; then exit 1; fi
      - name: Capture actual rendered expressions and generated sound samples
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          ROBOT_REVIEW_DIR: ${{ github.workspace }}/review
        run: |
          set -euo pipefail
          xvfb-run -a /tmp/Godot_v4.7.2-stable_linux.x86_64 --audio-driver Dummy --path robot3d -- --capture-review 2>&1 | tee /tmp/render.log
          if grep -E 'SCRIPT ERROR|Parse Error|ERROR:' /tmp/render.log; then exit 1; fi
          test -s review/happy.png
          test -s review/open.wav
      - name: Build exact versioned ZIP and verify existing host behavior
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p baseline
          gh release download v2.2.18 --repo "$GITHUB_REPOSITORY" --pattern 'MuhammadRobot-2.2.18.zip' --dir baseline
          python3 scripts/build_v2219_plush.py baseline/MuhammadRobot-2.2.18.zip dist/MuhammadRobot3D.pck dist/MuhammadRobot-2.2.19.zip
          python3 scripts/test_v2219_plush.py baseline/MuhammadRobot-2.2.18.zip dist/MuhammadRobot-2.2.19.zip
          xvfb-run -a /usr/bin/python3 scripts/test_v2219_native_menu.py baseline/MuhammadRobot-2.2.18.zip dist/MuhammadRobot-2.2.19.zip
      - uses: actions/upload-artifact@v4
        with:
          name: robot-v2219-package
          path: |
            dist/MuhammadRobot-2.2.19.zip
            dist/manifest.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: robot-v2219-review
          path: |
            review/
            /tmp/import.log
            /tmp/interaction.log
            /tmp/export.log
            /tmp/render.log

  windows-test:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: robot-v2219-package
          path: package
      - name: Run exported Windows EXE with actual packaged interaction tests
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Expand-Archive -LiteralPath 'package/MuhammadRobot-2.2.19.zip' -DestinationPath 'installed'
          $exe=(Resolve-Path 'installed/app/visual3d/MuhammadRobot3D.exe').Path
          $log=Join-Path $PWD 'windows-interaction.log'
          $p=Start-Process -FilePath $exe -ArgumentList '--headless','--log-file',"`"$log`"",'--','--interaction-test' -PassThru -NoNewWindow
          if (-not $p.WaitForExit(90000)) { $p.Kill(); throw 'Windows interaction test timed out' }
          if ($p.ExitCode -ne 0) { throw "Windows test failed: $($p.ExitCode)" }
          $text=Get-Content -Raw $log
          Write-Output $text
          if ($text -notmatch 'PASS: real scene emotions' -or $text -match 'SCRIPT ERROR|Parse Error|ERROR:') { throw 'Windows interaction assertions did not pass' }
      - name: Verify the actual shared Tk menu on Windows
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force baseline | Out-Null
          gh release download v2.2.18 --repo "$env:GITHUB_REPOSITORY" --pattern 'MuhammadRobot-2.2.18.zip' --dir baseline
          if ($LASTEXITCODE -ne 0) { throw 'Baseline download failed' }
          python scripts/test_v2219_native_menu.py baseline/MuhammadRobot-2.2.18.zip package/MuhammadRobot-2.2.19.zip
          if ($LASTEXITCODE -ne 0) { throw 'Native context menu check failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: robot-v2219-windows-log
          path: windows-interaction.log

  publish:
    if: github.ref == 'refs/heads/main'
    needs: windows-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: robot-v2219-package
          path: package
      - name: Publish immutable update after Linux and Windows checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v2.2.19 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Existing release retained'; exit 0
          fi
          gh release create v2.2.19 package/MuhammadRobot-2.2.19.zip package/manifest.json \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title 'Muhammad Robot v2.2.19 - Shared menu and soft plush' \
            --notes 'Right-click or belly-click on 3D opens the same full context menu as Classic, including Python Studio, learning, microphone, Drive, updates and exit. Every launch prefers 3D; Classic is a temporary recovery view. Softer springy squash/stretch with separate head and limb motion. Close robot shows a fluffy shaded cream pom-pom with larger black eyes. Added wink, curious, sleepy and heart-eye expressions. Existing quiet touch/Close/Open sounds, code and voice settings are preserved. Native Tk menu, Windows Godot runtime and exact updater ZIP passed automated checks.'
