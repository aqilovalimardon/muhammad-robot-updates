name: Publish Muhammad Robot v2.2.2 test release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v222.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verified update builder
        uses: actions/checkout@v4
      - name: Check whether v2.2.2 already exists
        id: exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v2.2.2 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'already_exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'already_exists=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Download previously published v2.2.1 archive
        if: steps.exist.outputs.already_exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p input dist
          gh release download v2.2.1 --repo "$GITHUB_REPOSITORY" --pattern 'MuhammadRobot-2.2.1.zip' --dir input
      - name: Build v2.2.2 and validate archive
        if: steps.exist.outputs.already_exists == 'false'
        run: |
          python scripts/build_v222.py input/MuhammadRobot-2.2.1.zip dist/MuhammadRobot-2.2.2.zip
      - name: Publish stable GitHub release
        if: steps.exist.outputs.already_exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v2.2.2 dist/MuhammadRobot-2.2.2.zip dist/manifest.json \
            --repo "$GITHUB_REPOSITORY" \
            --title 'Muhammad Robot v2.2.2 - Auto Update Test' \
            --notes 'Minimal auto-update test. Adds an About robot / version menu item. Retains code, voice commands, editor, and animations.' \
            --latest
